<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hello World</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    h1 {
      font-size: 4rem;
      color: #333;
    }
    button {
      touch-action: manipulation;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: #6c63ff;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:hover { background-color: #574fd6; }
    button:active { transform: scale(0.96); }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <button onclick="launchConfetti()">Celebrate!</button>
  <canvas id="confetti"></canvas>

  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COLORS = ['#6c63ff','#ff6584','#43c6ac','#f7971e','#ffd200','#00c6ff'];

    function Particle() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * -canvas.height;
      this.w = 8 + Math.random() * 8;
      this.h = 4 + Math.random() * 6;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.spin = (Math.random() - 0.5) * 0.2;
      this.vx = (Math.random() - 0.5) * 4;
      this.vy = 3 + Math.random() * 4;
    }

    function launchConfetti() {
      particles.push(...Array.from({ length: 150 }, () => new Particle()));
      if (!animId) animate();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.spin;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      particles = particles.filter(p => p.y < canvas.height + 20);
      if (particles.length > 0) {
        animId = requestAnimationFrame(animate);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animId = null;
      }
    }
  </script>
</body>
</html>
